<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f8" />
    <script>
      (() => {
        let theme = "light";
        try {
          if (localStorage.getItem("uni-console-theme") === "dark")
            theme = "dark";
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#101916" : "#f6f7f8";
      })();
      // Check the existing session while the application bundle downloads.
      // The application still awaits this response before restoring private data.
      globalThis.__uniConsoleSessionBootstrap = {
        startedAt: Date.now(),
        result: fetch("/analytics/v1/auth/me", {
          credentials: "same-origin", cache: "no-store",
          headers: { Accept: "application/json", "Content-Type": "application/json" },
          signal: AbortSignal.timeout(10000),
        }).then(response => response.ok ? response.json() : null).catch(() => null),
      };
    </script>
    <style>
      html {
        background: #f6f7f8;
        color-scheme: light;
      }
      html[data-theme="dark"] {
        background: #101916;
        color-scheme: dark;
      }
    </style>
    <meta
      name="description"
      content="uni-api 控制台 — 从渠道可用性、请求等待到上游余额，让每次模型路由清晰可见。"
    />
    <title>uni-api · 渠道控制台</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
