upstream analytics_pool {
    server ${ANALYTICS_UPSTREAM_ADDRESS};
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location = /healthz { access_log off; default_type application/json; return 200 '{"status":"ok","app":"uni-api-console"}'; }
    location /analytics/ {
        # Authenticated API configuration controls its own optional byte budget.
        client_max_body_size 0;
        proxy_ssl_server_name on;
        proxy_ssl_name ${ANALYTICS_UPSTREAM_ADDRESS};
        proxy_pass ${ANALYTICS_UPSTREAM_SCHEME}://analytics_pool${ANALYTICS_UPSTREAM_PATH}/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host ${ANALYTICS_UPSTREAM_ADDRESS};
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Allow the bounded atomic source batch to finish and persist its receipt.
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
    location /assets/ { try_files $uri =404; expires 1y; }
    location / { try_files $uri $uri/ /index.html; expires -1; }
    gzip on;
    # Fugue adds Via; nginx otherwise disables compression for proxied clients.
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
