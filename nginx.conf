server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location = /healthz { access_log off; default_type application/json; return 200 '{"status":"ok","app":"uni-api-console"}'; }
    location /analytics/ {
        proxy_ssl_server_name on;
        proxy_pass https://uni-api-web-solar.fugue.pro/;
        proxy_http_version 1.1;
        proxy_set_header Host uni-api-web-solar.fugue.pro;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
    location /assets/ { try_files $uri =404; expires 1y; }
    location / { try_files $uri $uri/ /index.html; expires -1; }
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
