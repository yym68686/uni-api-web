services:
  uni-api-console:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ANALYTICS_UPSTREAM: ${ANALYTICS_UPSTREAM:-http://analytics-api:8080}
    ports:
      - "80"
    depends_on:
      analytics-api:
        condition: service_healthy
    restart: unless-stopped
  analytics-api:
    build:
      context: ./analytics-api
      dockerfile: Dockerfile
    environment:
      LISTEN_ADDR: ":8080"
      DATA_DIR: /data
      # The upstream address is explicit configuration and may point at any
      # compatible uni-api gateway. The request key remains browser supplied.
      UNI_API_URL: ${UNI_API_URL:-}
      ANALYTICS_TIMEZONE: ${ANALYTICS_TIMEZONE:-Asia/Shanghai}
      SOURCE_ID: ${SOURCE_ID:-uni-api-console}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-uni-api-facts/v1/}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-auto}
      # Facts remain read-only. Settings and the rebuildable query checkpoint
      # use a separate bucket and a separate application credential.
      STATE_S3_ENDPOINT: ${STATE_S3_ENDPOINT:-}
      STATE_S3_BUCKET: ${STATE_S3_BUCKET:-}
      STATE_S3_PREFIX: ${STATE_S3_PREFIX:-analytics/v1}
      STATE_AWS_ACCESS_KEY_ID: ${STATE_AWS_ACCESS_KEY_ID:-}
      STATE_AWS_SECRET_ACCESS_KEY: ${STATE_AWS_SECRET_ACCESS_KEY:-}
      REQUIRE_INITIAL_IMPORT: "true"
    # /data is a per-container query cache. Sharing one DuckDB file across old
    # and new replicas would prevent safe rolling updates.
    ports:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 20s
      timeout: 3s
      retries: 5
